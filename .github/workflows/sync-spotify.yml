name: Oppdater Borderline fra Spotify
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent Spotify-spilleliste
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" && test -n "$SPOTIFY_REFRESH_TOKEN" || { echo "Mangler Spotify secrets"; exit 1; }
          python scripts/sync_spotify.py
      - name: Publiser endringer
        run: |
          if git diff --quiet -- borderline-sangliste.json; then
            echo "Ingen nye sanger"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add borderline-sangliste.json
          git commit -m "Oppdater Borderline-spillelisten automatisk"
          git push
